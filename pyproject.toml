[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontier-reasoning-engine"
version = "0.1.0"
description = "Local-first, provider-neutral reasoning control plane"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "PyYAML>=6,<7"]

[dependency-groups]
dev = ["hypothesis>=6.138", "mypy>=1.17", "pytest>=8.4", "ruff>=0.12", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/fre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["unit: isolated unit tests", "property: property-based tests", "integration: storage integration tests", "golden: golden tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = [
  "FRE_MODULE_MANIFEST.yaml",
  "CODEX_BUILD_HANDOFF.md",
  "Frontier Reasoning Engine Build Plan.txt",
  "FRE_ARCHITECTURE_V1.md",
  "README.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fre"]
